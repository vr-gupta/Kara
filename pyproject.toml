[project]
name = "kara"
version = "0.1.0"
description = "A benchtop manipulation project with the SO-101 robotic arm."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lerobot[feetech]>=0.4.4",
    "mujoco>=3.6.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.0.3"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.19",
]

[tool.uv]
# Use Homebrew's Python (ships libpython3.11.dylib as a shared lib),
# which mjpython requires on macOS. uv's bundled standalone Python
# is statically linked and breaks mjpython (libpython dlopen failure).
python-preference = "only-system"
